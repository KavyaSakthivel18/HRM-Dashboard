<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏢 HRM Dashboard</h1>
        <nav>
            <a href="#employees">Employees</a>
            <a href="#leaves">Leave Requests</a>
            <a href="#meetings">Meetings</a>
            <a href="events.html">Events</a>
        </nav>
    </header>

    <!-- Employees Section -->
    <section id="employees">
        <h2>👥 Employee Management</h2>
        <div class="form-container">
            <input type="text" id="eid" placeholder="Employee ID">
            <input type="text" id="name" placeholder="Name">
            <input type="number" id="age" placeholder="Age">
            <input type="text" id="manager" placeholder="Manager Name">
            <button onclick="saveEData()">Add Employee</button>
        </div>
        <table id="employeeTable">
            <thead>
                <tr>
                    <th>SI.NO</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Manager</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- Leave Requests Section -->
    <section id="leaves">
        <h2>📅 Leave Requests</h2>
        <div class="form-container">
            <input type="text" id="empName" placeholder="Employee Name">
            <input type="text" id="empId" placeholder="Employee ID">
            <select id="leaveType">
                <option value="">Select Leave Type</option>
                <option value="Casual">Casual</option>
                <option value="Medical">Medical</option>
                <option value="Annual">Annual</option>
            </select>
            <input type="date" id="fromDate">
            <input type="date" id="toDate">
            <textarea id="reason" placeholder="Reason"></textarea>
            <button onclick="submitLeaveRequest()">Submit Leave Request</button>
        </div>
        <table id="leaveTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Employee</th>
                    <th>Type</th>
                    <th>From-To</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- Meetings Section -->
    <section id="meetings">
        <h2>📋 Meeting Schedules</h2>
        <div class="form-container">
            <input type="text" id="meetingTitle" placeholder="Meeting Title">
            <input type="date" id="meetingDate">
            <input type="time" id="meetingTime">
            <input type="text" id="organizer" placeholder="Organizer">
            <input type="text" id="platform" placeholder="Platform/Location">
            <button onclick="scheduleMeeting()">Schedule Meeting</button>
        </div>
        <table id="meetingTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Organizer</th>
                    <th>Platform</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <script src="script.js"></script>
</body>
</html>
