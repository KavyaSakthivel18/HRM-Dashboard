<!DOCTYPE html>
<html>
<head>
  <title>HRM Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<header>
  <h1>HRM Dashboard</h1>
  <nav>
    <a href="#employees">Employees</a>
    <a href="#leaves">Leaves</a>
    <a href="#meetings">Meetings</a>
    <a href="events.html">Events</a>
  </nav>
</header>

<section id="employees">
  <h2>Employee Management</h2>
  <input id="eid" placeholder="ID">
  <input id="name" placeholder="Name">
  <input id="age" type="number" placeholder="Age">
  <input id="manager" placeholder="Manager">
  <button onclick="addEmployee()">Add</button>
  <table id="employeeTable">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Age</th><th>Manager</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section id="leaves">
  <h2>Leave Requests</h2>
  <input id="empName" placeholder="Name">
  <input id="empId" placeholder="Employee ID">
  <input id="leaveType" placeholder="Type">
  <input id="fromDate" type="date">
  <input id="toDate" type="date">
  <input id="reason" placeholder="Reason">
  <button onclick="addLeave()">Submit</button>
  <table id="leaveTable">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Status</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section id="meetings">
  <h2>Meetings</h2>
  <input id="meetingTitle" placeholder="Title">
  <input id="meetingDate" type="date">
  <input id="meetingTime" type="time">
  <input id="organizer" placeholder="Organizer">
  <input id="platform" placeholder="Platform">
  <button onclick="addMeeting()">Schedule</button>
  <table id="meetingTable">
    <thead>
      <tr><th>ID</th><th>Title</th><th>Action</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
